[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stha-sports-analytics"
version = "0.1.0"
description = "Reproducible reference implementation for sports rotation & gymnastics scoring (DTW)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pyyaml>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
